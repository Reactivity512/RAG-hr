services:
  # ─────────────────────────────────────────────
  # Инфраструктура
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-hr
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - ml-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis-hr
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - ml-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # API (Spring Boot, профиль api) — чат, загрузка, список, статусы
  # ─────────────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: rag/Dockerfile
    image: rag-hr:latest
    container_name: rag-api-hr
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      RESUMES_DIR: /app/resumes
      # По умолчанию — локальный Ollama на хосте; см. .env.example
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_BACKEND_URL: ${LLM_BACKEND_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./resumes:/app/resumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Worker (Spring Boot, профиль worker) — Redis Streams:
  # извлечение текста → разбор → эмбеддинг → Qdrant
  # ─────────────────────────────────────────────
  rag-worker:
    build:
      context: .
      dockerfile: rag/Dockerfile
    image: rag-hr:latest
    container_name: rag-worker-hr
    entrypoint:
      - sh
      - -c
      - exec java $JAVA_OPTS -jar /app/rag-hr.jar --spring.profiles.active=worker
    # У воркера нет порта: живость проверяется по наличию процесса
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f rag-hr.jar >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      RESUMES_DIR: /app/resumes
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./resumes:/app/resumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ПРОФИЛЬ: Ollama в Docker (CPU-only)
  # Запуск: docker compose --profile ollama-docker up -d
  # В .env: OLLAMA_BASE_URL=http://ollama:11434
  #         LLM_BACKEND_URL=http://ollama:11434/v1
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-hr
    profiles: ["ollama-docker"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_NUM_PARALLEL: 1
      # Контекст 8192: Ollama молча обрезает вход по этому значению,
      # а резюме длиннее дефолтных 2048 токенов
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ml-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ПРОФИЛЬ: vLLM (GPU ≥ compute 7.0, ≥ 8GB VRAM)
  # Запуск: docker compose --profile vllm up -d
  # В .env: LLM_BACKEND_URL=http://vllm:8000/v1
  #         LLM_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ
  # ─────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-hr
    profiles: ["vllm"]
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --port 8000
      --host 0.0.0.0
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ml-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 1200s
    restart: unless-stopped

networks:
  ml-net:
    driver: bridge

volumes:
  redis_data:
  ollama_data:
  hf_cache:
